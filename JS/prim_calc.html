<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const plus = (a,b) => a+b;
        const minus = (a,b) => a-b;
        const times = (a,b) => a*b;
        const slash = (a,b) => a/b;
        document.write(plus(1,2)+"<br>");
        document.write(minus(1,2)+"<br>");
        document.write(times(1,2)+"<br>");
        document.write(slash(1,2)+"<br>");
    </script>
</body>
</html>
